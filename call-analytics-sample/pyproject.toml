[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-analytics-sample"
version = "0.1.0"
description = "A reproducible transcript-to-analytics pipeline using synthetic calls"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["google-genai>=1.0,<3"]

[project.scripts]
call-analytics = "call_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["call_pipeline*"]

[tool.setuptools.package-data]
call_pipeline = ["prompts/*.txt", "data/*.json", "data/*.jsonl"]

